<html>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=no'>
    <meta name='mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-capable' content='yes'>
    <link rel='icon' type='image/png' sizes='32x32' href='favicon-32x32.png'>
    <link rel='icon' type='image/png' sizes='96x96' href='favicon-96x96.png'>
    <link rel='stylesheet' href='src/css/common.css'>
    <script src='src/util/w.js'></script>
    <title>Immersive VR Session</title>
</head>
<body>
    <header>
        <details open>
            <summary>Immersive VR Session</summary>
            <p>
                This sample demonstrates how to use an 'immersive-vr' XRSession to
                present a W scene to an XR device. The scene also renders to the page
                when not in XR.
                <a class="back" href="./">Back</a>
            </p>
        </details>
    </header>
    <main style='text-align: center;'>
        <p>Click 'Enter XR' to see content</p>
        <canvas id=c width=600 height=500></canvas>
    </main>
    <script type="module">
        import {WebXRButton} from './src/util/webxr-button.js';

        const canvas = document.getElementById('c');
        W.reset(canvas, { xrCompatible: true });

        W.camera({ z: 5 });
        W.light({ z: -1 });
        W.group({ n: 'G', ry: 0, z: -2 });
        W.plane({ g: 'G', x: -1, y: 1 });
        W.billboard({ g: 'G', x: 1, y: 1 });
        W.cube({ g: 'G', x: -1.5, y: -1 });
        W.pyramid({ g: 'G', x: 0, y: -1 });
        W.sphere({ g: 'G', x: 1.5, y: -1, s: 1 });

        let xrButton = null;
        let xrRefSpace = null;
        let lastXRFrameTime = 0;

        function initXR() {
            xrButton = new WebXRButton({
                onRequestSession: onRequestSession,
                onEndSession: onEndSession,
            });
            document.querySelector('header').appendChild(xrButton.domElement);

            if (navigator.xr) {
                navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                    xrButton.enabled = supported;
                });
            }
        }

        function onRequestSession() {
            return navigator.xr.requestSession('immersive-vr').then(onSessionStarted);
        }

        async function onSessionStarted(session) {
            xrButton.setSession(session);
            session.addEventListener('end', onSessionEnded);

            await W.gl.makeXRCompatible();
            session.updateRenderState({
                baseLayer: new XRWebGLLayer(session, W.gl),
            });

            W.startXR();

            xrRefSpace = await session.requestReferenceSpace('local');
            session.requestAnimationFrame(onXRFrame);
        }

        function onEndSession(session) {
            session.end();
        }

        function onSessionEnded() {
            xrButton.setSession(null);
            W.endXR();
            xrRefSpace = null;
            lastXRFrameTime = 0;
        }

        function onXRFrame(t, frame) {
            const session = frame.session;
            session.requestAnimationFrame(onXRFrame);

            const dt = t - (lastXRFrameTime || t - 16);
            lastXRFrameTime = t;

            const pose = frame.getViewerPose(xrRefSpace);
            if (!pose) return;

            const glLayer = session.renderState.baseLayer;
            W.gl.bindFramebuffer(W.gl.FRAMEBUFFER, glLayer.framebuffer);
            W.gl.clear(W.gl.COLOR_BUFFER_BIT | W.gl.DEPTH_BUFFER_BIT);

            for (const view of pose.views) {
                const viewport = glLayer.getViewport(view);
                W.gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);
                W.drawView(view.projectionMatrix, view.transform, dt);
            }
        }

        initXR();
    </script>
</body>
</html>
