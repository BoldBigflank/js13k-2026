<html>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=no'>
    <meta name='mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-capable' content='yes'>
    <link rel='icon' type='image/png' sizes='32x32' href='favicon-32x32.png'>
    <link rel='icon' type='image/png' sizes='96x96' href='favicon-96x96.png'>
    <link rel='stylesheet' href='src/css/common.css'>
    <script src='src/util/w.js'></script>
    <script src='src/util/w-extensions.js'></script>
    <script src='src/util/w-xr.js'></script>
    <title>Immersive VR Session</title>
</head>

<body>
    <header>
    </header>
    <main style='text-align: center;'>
        <p>Click the canvas to lock the mouse and look around. Click 'Enter XR' for VR.</p>
        <canvas id=c width=1024 height=768></canvas>
    </main>
    <script type="module">
        import { WebXRButton, WebXRInputSelection } from './src/util/webxr-button.js';
        import { perlinTexture, starTexture, testTexture } from './src/textures.js';
        import { extrude2DTo3DModel, rotateAxisAngle } from './src/util/helpers.js';
        import { Game, getBestMove, printBoard } from './src/game.ts';

        const game = new Game();

        // Test moves
        // game.move({ x: 3, y: 3 }, { x: 2, y: 4 }); // 🦊 moves away
        // game.move({ x: 2, y: 2 }, { x: 2, y: 3 }); // 🪿 moves down
        // game.move({ x: 2, y: 4 }, { x: 2, y: 2 }); // 🦊 jumps 🪿
        // game.move({ x: 4, y: 2 }, { x: 4, y: 3 }); // 🪿 moves down
        // game.move({ x: 2, y: 2 }, { x: 4, y: 2 }); // 🦊 jumps 🪿 and has another jump
        // game.pass() // 🦊 doesn't take the jump
        (async () => {
            // Run the loop in a microtask to avoid blocking the main thread
            while (!game.gameState.winner) {
                // Optionally, await a small delay to yield to the event loop
                await new Promise(resolve => setTimeout(resolve, 0));
                const bestMove = getBestMove(game.gameState, 5);
                game.move(bestMove);
                // console.log(printBoard(game.gameState.board))
            }
        })();


        const canvas = document.getElementById('c');
        W.reset(canvas, { xrCompatible: true });
        W.enableMouseControls();

        const tex = perlinTexture();
        const starTex = starTexture(2048);
        const testTex = testTexture(2048);
        const rotateObject = (ry) => {
            return ({ name }) => W.move({ n: name, ry: ry, a: 1000 });
        };

        // Camera group
        W.camera({ n: 'camera', y: 2, z: 0, rx: -30 });
        W.light({ z: -1 });
        W.group({ n: 'G', ry: 0, z: -2 });

        // Floor
        W.plane({
            n: 'floor',
            g: 'G', x: 0, y: 0, rx: -90, w: 200, h: 200, ts: 2, t: tex, b: '00f', mix: 0.5, selectable: false,
        });

        // Billboard
        W.billboard({ n: 'sign', g: 'G', x: 2, y: 2, w: 1, h: 2, t: tex, selectable: false });
        // Tiled Cube
        W.tileCube({
            n: 'cube', g: 'G', x: -1.5, y: 0.5, w: 1, h: 1, d: 1, t: testTex, selectable: true,
            onSelectStart: rotateObject(90),
            onSelectEnd: rotateObject(0),
        });

        // Pyramid
        // W.pyramid({ g: 'G', x: 0, y: 0.5, ts: 3, t: tex, selectable: true });

        // Cylinder
        W.cylinder({ n: 'cylinder', g: 'G', rx: 0, b: '00f', mix: 0.1, w: 1, h: 1, d: 1, t: testTex });
        let cylinderRotation = 0;
        setInterval(() => {
            cylinderRotation += 0.005;
            const rotationMatrix = rotateAxisAngle([0, 18, 100], cylinderRotation);
            W.move({ n: 'cylinder', M: rotationMatrix });
            W.move({ n: 'skybox', M: rotationMatrix });
        }, 16);

        // Star skybox
        // Attached to the camera
        const starSkybox = W.sphere({ n: 'skybox', t: starTex, x: 0, y: 2, z: 0, rx: 23, size: -500, unlit: true });


        const xrInput = new WebXRInputSelection();

        let xrButton = null;
        let xrRefSpace = null;
        let lastXRFrameTime = 0;

        function initXR() {
            xrButton = new WebXRButton({
                onRequestSession: onRequestSession,
                onEndSession: onEndSession,
            });
            document.querySelector('header').appendChild(xrButton.domElement);

            if (navigator.xr) {
                navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                    xrButton.enabled = supported;
                });
            }
        }

        async function requestPlayAreaReferenceSpace(session) {
            for (const type of ['local-floor', 'local']) {
                try {
                    return await session.requestReferenceSpace(type);
                } catch (_) { }
            }
            throw new Error('No supported reference space');
        }

        function onRequestSession() {
            return navigator.xr.requestSession('immersive-vr', {
                optionalFeatures: ['local-floor'],
            }).then(onSessionStarted);
        }

        async function onSessionStarted(session) {
            xrButton.setSession(session);
            session.addEventListener('end', onSessionEnded);

            await W.gl.makeXRCompatible();
            session.updateRenderState({
                baseLayer: new XRWebGLLayer(session, W.gl),
            });

            W.startXR();

            xrRefSpace = await requestPlayAreaReferenceSpace(session);
            // Some XR runtimes return a ref space that isn't a full EventTarget.
            if (typeof xrRefSpace.addEventListener === 'function') {
                xrRefSpace.addEventListener('reset', (event) => {
                    console.debug('XR reference space reset', event.transform);
                });
            }
            xrInput.attach(session, () => xrRefSpace);
            session.requestAnimationFrame(onXRFrame);
        }

        function onEndSession(session) {
            session.end();
        }

        function onSessionEnded() {
            xrInput.detach();
            xrButton.setSession(null);
            W.endXR();
            xrRefSpace = null;
            lastXRFrameTime = 0;
        }

        function onXRFrame(t, frame) {
            const session = frame.session;
            session.requestAnimationFrame(onXRFrame);

            const dt = t - (lastXRFrameTime || t - 16);
            lastXRFrameTime = t;

            const pose = frame.getViewerPose(xrRefSpace);
            if (!pose) return;

            xrInput.update(frame);

            const glLayer = session.renderState.baseLayer;
            W.gl.bindFramebuffer(W.gl.FRAMEBUFFER, glLayer.framebuffer);
            W.gl.clear(W.gl.COLOR_BUFFER_BIT | W.gl.DEPTH_BUFFER_BIT);

            for (const view of pose.views) {
                const viewport = glLayer.getViewport(view);
                W.gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);
                W.drawView(view.projectionMatrix, view.transform, pose.transform, dt);
            }
        }

        initXR();
    </script>
</body>

</html>
